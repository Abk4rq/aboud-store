<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUD STORE | عبود ستور</title>
    <style>
        :root { --main-orange: #f97316; --dark-green: #064e3b; --bg-navy: #0f172a; }
        body { background-color: var(--bg-navy); color: white; font-family: sans-serif; margin: 0; }
        
        /* الهيدر مثل الصورة 1000725819.jpg */
        header { background: var(--dark-green); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-orange); }
        .logo { color: var(--main-orange); font-weight: bold; font-size: 1.4rem; }

        /* لوحة التحكم (تظهر لك فقط) */
        .admin-section { margin: 20px; padding: 20px; border: 2px dashed var(--main-orange); border-radius: 15px; background: #1e293b; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        .add-btn { background: var(--main-orange); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* شبكة المنتجات مثل الصور الأولى */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 10px; text-align: center; color: black; position: relative; }
        .card img { width: 100%; height: 120px; object-fit: contain; }
        .card h4 { margin: 10px 0 5px; font-size: 0.9rem; }
        .card p { color: var(--main-orange); font-weight: bold; margin: 0; }
        .del-btn { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">ABOUD STORE</div>
    <div style="font-size: 1.5rem;">🛒</div>
</header>

<!-- قسم الأدمن -->
<div class="admin-section" id="adminPanel">
    <h3 style="text-align: center; margin-top: 0;">إدارة المتجر (الأدمن)</h3>
    <input type="text" id="name" placeholder="اسم المنتج">
    <input type="number" id="price" placeholder="السعر (د.ع)">
    <input type="text" id="img" placeholder="رابط صورة المنتج">
    <button class="add-btn" onclick="saveProduct()">إضافة السلعة للموقع</button>
</div>

<!-- عرض المنتجات -->
<h3 style="padding-right: 15px; color: var(--main-orange);">أحدث المنتجات</h3>
<div class="products-grid" id="container"></div>

<script>
    // نظام التخزين المحلي (حتى لا تضيع البيانات عند التحديث)
    let products = JSON.parse(localStorage.getItem('myProducts')) || [];

    function render() {
        const container = document.getElementById('container');
        container.innerHTML = products.map((p, index) => `
            <div class="card">
                <button class="del-btn" onclick="deleteProduct(${index})">×</button>
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                <h4>${p.name}</h4>
                <p>${p.price.toLocaleString()} د.ع</p>
            </div>
        `).join('');
    }

    function saveProduct() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('price').value;
        const i = document.getElementById('img').value;

        if(n && p && i) {
            products.push({name: n, price: parseInt(p), img: i});
            localStorage.setItem('myProducts', JSON.stringify(products));
            render();
            // مسح الخانات بعد الإضافة
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('img').value = '';
        } else {
            alert("يرجى ملء جميع الخانات");
        }
    }

    function deleteProduct(index) {
        if(confirm("هل تريد حذف هذه السلعة؟")) {
            products.splice(index, 1);
            localStorage.setItem('myProducts', JSON.stringify(products));
            render();
        }
    }

    // تشغيل العرض عند فتح الصفحة
    render();
</script>

</body>
</html>
