<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | الإدارة المتكاملة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 120px; }
        
        header { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* لوحة الإدارة بنمط "فلات" - ثابتة ومريحة */
        #admin-section { display: none; background: #0a0a0a; padding: 20px; border-bottom: 1px solid #222; margin-bottom: 20px; }
        .admin-card { max-width: 500px; margin: 0 auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; font-family: 'Cairo'; }
        .btn-pub { width: 100%; padding: 12px; background: var(--neon); color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-logout { background: #ff4444; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }

        /* السلايدر والمنتجات */
        .slider { margin: 15px; border-radius: 15px; overflow: hidden; height: 160px; position: relative; border: 1px solid var(--neon); }
        .slider img { width: 100%; height: 100%; object-fit: contain; position: absolute; opacity: 0; transition: 0.5s; }
        .slider img.active { opacity: 1; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; border-radius: 10px; }
        .price { color: var(--neon); font-weight: 700; margin: 5px 0; font-size: 1.1rem; }
        
        .del-icon { position: absolute; top: 10px; right: 10px; color: #ff4444; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 50%; display: none; cursor: pointer; }

        /* نظام السلة الجديد - عائم وبسيط */
        .cart-toggle { position: fixed; bottom: 25px; left: 25px; background: var(--neon); color: black; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; z-index: 2000; box-shadow: 0 0 15px var(--neon); cursor: pointer; }
        .badge { position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }

        #cart-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <i class="fas fa-user-lock" onclick="login()" style="color: var(--neon); cursor: pointer;"></i>
    <div class="logo">ABOUD STORE</div>
    <div style="width:20px"></div>
</header>

<section id="admin-section">
    <div class="admin-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0; color:var(--neon)">لوحة الإدارة</h3>
            <button class="btn-logout" onclick="auth.signOut(); location.reload();">خروج</button>
        </div>
        <select id="mode" onchange="document.getElementById('pInfo').style.display = this.value=='p'?'block':'none'">
            <option value="p">إضافة منتج</option>
            <option value="a">إضافة إعلان</option>
        </select>
        <div id="pInfo">
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="text" id="pPrice" placeholder="السعر">
        </div>
        <input type="file" id="pFile" accept="image/*">
        <button id="pBtn" onclick="upload()" class="btn-pub">نشر الآن</button>
        <div id="adsManage" style="margin-top:15px; border-top:1px solid #222; padding-top:10px;"></div>
    </div>
</section>

<div class="slider" id="slider"></div>
<div class="grid" id="main-grid"></div>

<div class="cart-toggle" onclick="showCart()">
    <i class="fas fa-shopping-cart"></i>
    <div class="badge" id="bCount">0</div>
</div>

<div id="cart-view">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--neon); padding-bottom:15px;">
        <h2>سلة الطلبات</h2>
        <i class="fas fa-times" onclick="showCart()" style="font-size:1.5rem"></i>
    </div>
    <div id="cart-items" style="margin-top:20px;"></div>
    <button onclick="orderNow()" style="width:100%; background:#25D366; color:white; border:none; padding:15px; border-radius:10px; margin-top:30px; font-weight:bold; font-size:1.1rem;">إرسال عبر واتساب <i class="fab fa-whatsapp"></i></button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s", databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    let myCart = [];

    // التحكم في ظهور لوحة الإدارة والملفات
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('admin-section').style.display = 'block';
            document.querySelectorAll('.del-icon').forEach(e => e.style.display = 'block');
        }
    });

    function login() {
        if(!auth.currentUser) {
            const e = prompt("البريد الإلكتروني:"), p = prompt("كلمة المرور:");
            if(e && p) auth.signInWithEmailAndPassword(e,p).catch(() => alert("خطأ في البيانات"));
        }
    }

    // جلب البيانات (منتجات وإعلانات)
    db.ref('ads').on('value', snap => {
        const s = document.getElementById('slider'), am = document.getElementById('adsManage');
        s.innerHTML = ''; am.innerHTML = '';
        snap.forEach(c => {
            s.innerHTML += `<img src="${c.val().i}">`;
            if(auth.currentUser) am.innerHTML += `<div style="padding:5px; border-bottom:1px solid #222;">إعلان <span onclick="remove('ads','${c.key}')" style="color:red; float:left; cursor:pointer;">حذف</span></div>`;
        });
        if(s.firstChild) s.firstChild.classList.add('active');
    });

    db.ref('products').on('value', snap => {
        const g = document.getElementById('main-grid'); g.innerHTML = '';
        snap.forEach(c => {
            const d = c.val();
            const show = auth.currentUser ? 'block' : 'none';
            g.innerHTML += `
                <div class="card">
                    <i class="fas fa-trash-alt del-icon" style="display:${show}" onclick="remove('products','${c.key}')"></i>
                    <img src="${d.i}">
                    <h4 style="margin:5px 0; font-size:0.85rem">${d.n}</h4>
                    <div class="price">${d.p} د.ع</div>
                    <button onclick="addToCart('${d.n}', '${d.p}')" style="width:100%; padding:8px; background:var(--neon); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">إضافة للسلة</button>
                </div>`;
        });
    });

    function upload() {
        const m = document.getElementById('mode').value, f = document.getElementById('pFile').files[0];
        if(!f) return alert("اختر صورة أولاً");
        const b = document.getElementById('pBtn'); b.innerText = "جارِ الرفع...";
        const r = new FileReader();
        r.onload = (e) => {
            const data = { i: e.target.result };
            if(m == 'p') { data.n = document.getElementById('pName').value; data.p = document.getElementById('pPrice').value; }
            db.ref(m == 'p' ? 'products' : 'ads').push(data).then(() => { alert("تم النشر"); location.reload(); });
        };
        r.readAsDataURL(f);
    }

    function remove(path, id) { if(confirm("هل تريد الحذف نهائياً؟")) db.ref(path+'/'+id).remove(); }

    // نظام السلة
    function addToCart(n, p) { myCart.push({n, p}); updateUI(); }
    function showCart() { const v = document.getElementById('cart-view').style; v.display = v.display === 'block' ? 'none' : 'block'; }
    function updateUI() {
        document.getElementById('bCount').innerText = myCart.length;
        const list = document.getElementById('cart-items'); list.innerHTML = '';
        myCart.forEach((item, index) => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #222;"><span>${item.n}</span><i class="fas fa-minus-circle" style="color:red" onclick="myCart.splice(${index},1); updateUI();"></i></div>`;
        });
    }
    function orderNow() {
        if(myCart.length === 0) return alert("السلة فارغة");
        let text = "طلب جديد من متجر Aboud Store:\n";
        myCart.forEach(i => text += `- ${i.n} (${i.p})\n`);
        window.location.href = `https://wa.me/9647818025533?text=${encodeURIComponent(text)}`;
    }

    setInterval(() => {
        const imgs = document.querySelectorAll('.slider img');
        if(imgs.length < 2) return;
        let act = document.querySelector('.slider img.active');
        act.classList.remove('active');
        let nxt = act.nextElementSibling || imgs[0];
        nxt.classList.add('active');
    }, 4000);
</script>
</body>
</html>
