<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --main-bg: #050505;
            --glass-card: rgba(255, 255, 255, 0.08);
        }
        body {
            background: var(--main-bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* الهيدر الفخم */
        header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            cursor: pointer;
            transition: 0.3s;
        }
        .logo:hover { transform: scale(1.05); }

        /* حاوية المنتجات */
        .container { padding: 20px 10px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 15px;
        }

        /* كارت المنتج */
        .product-card {
            background: var(--glass-card);
            border-radius: 20px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transform: translateY(-8px);
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 15px;
            background: #111;
        }
        .product-card h3 {
            font-size: 1rem;
            margin: 12px 0 5px;
            color: #efefef;
        }
        .price {
            color: var(--neon-blue);
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        /* أزرار الطلب */
        .order-actions {
            display: flex;
            gap: 6px;
        }
        .btn {
            flex: 1;
            padding: 10px 5px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-wa { background: #25d366; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn-ig { background: #e1306c; box-shadow: 0 4px 10px rgba(225, 48, 108, 0.3); }

        /* لوحة التحكم */
        #adminPanel {
            display: none;
            background: rgba(0,0,0,0.95);
            padding: 25px;
            border-radius: 25px;
            border: 2px solid var(--neon-blue);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            z-index: 2000;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .add-now {
            background: var(--neon-blue);
            color: black;
            font-weight: bold;
            border: none;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }
        .overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            z-index: 1500;
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="openAdmin()">ABOUD STORE</div>
</header>

<div class="overlay" id="overlay" onclick="closeAdmin()"></div>

<div id="adminPanel">
    <h2 style="text-align:center; color:var(--neon-blue);">إضافة منتج جديد</h2>
    <input type="text" id="pName" placeholder="اسم الجهاز">
    <input type="text" id="pPrice" placeholder="السعر (مثلاً: 450,000)">
    <input type="file" id="pImg" accept="image/*">
    <button class="add-now" onclick="saveProduct()">نشر في الموقع</button>
</div>

<div class="container">
    <div class="products-grid" id="productsList">
        </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s",
        authDomain: "aboud-store-f7a16.firebaseapp.com",
        projectId: "aboud-store-f7a16",
        storageBucket: "aboud-store-f7a16.firebasestorage.app",
        messagingSenderId: "554846072421",
        appId: "1:554846072421:web:214e6516b8cbf88715208c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function openAdmin() {
        const pass = prompt("أدخل رمز الإدارة:");
        if(pass === "ABOJL2001") { // الرمز الجديد
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
    }

    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const file = document.getElementById('pImg').files[0];

        if(name && price && file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                db.ref('products').push({
                    name: name,
                    price: price,
                    image: e.target.result
                }).then(() => {
                    alert("تمت الإضافة بنجاح!");
                    location.reload();
                });
            };
            reader.readAsDataURL(file);
        }
    }

    // عرض المنتجات وتفعيل أزرار واتساب وانستا
    db.ref('products').on('value', (snapshot) => {
        const list = document.getElementById('productsList');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const data = child.val();
            // رقم الهاتف واليوزر الخاص بك
            const waLink = `https://wa.me/9647818025533?text=مرحباً عبود، أريد استفسر عن: ${data.name}`;
            const igLink = `https://www.instagram.com/vh.rr/`;

            list.innerHTML += `
                <div class="product-card">
                    <img src="${data.image}" loading="lazy">
                    <h3>${data.name}</h3>
                    <div class="price">${data.price} د.ع</div>
                    <div class="order-actions">
                        <a href="${waLink}" target="_blank" class="btn btn-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                        <a href="${igLink}" target="_blank" class="btn btn-ig"><i class="fab fa-instagram"></i> انستا</a>
                    </div>
                </div>
            `;
        });
    });
</script>
</body>
</html>
