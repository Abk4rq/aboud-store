<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --card: #121212; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 80px; }
        
        header { background: rgba(0,0,0,0.9); padding: 20px; text-align: center; border-bottom: 2px solid var(--neon); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); cursor: pointer; }

        /* شريط البحث */
        .search-container { padding: 15px; }
        #searchBar { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--neon); background: #111; color: white; font-family: 'Cairo'; box-sizing: border-box; }

        /* لوحة التحكم */
        #admin-panel { display: none; background: #000; padding: 20px; border: 1px solid var(--neon); margin: 15px; border-radius: 15px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }

        /* شبكة المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid #222; text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 10px; background: #000; }
        .price { color: var(--neon); font-weight: bold; margin: 10px 0; }

        /* أزرار السلة */
        .add-cart { width: 100%; padding: 10px; background: var(--neon); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .add-cart:active { transform: scale(0.95); }

        /* السلة العائمة */
        .cart-float { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--neon); color: #000; padding: 15px; border-radius: 15px; display: none; justify-content: space-between; align-items: center; font-weight: bold; z-index: 1000; box-shadow: 0 0 20px var(--neon); }
        .btn-send { background: #000; color: #fff; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }

        /* قائمة الحذف */
        .admin-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 5px; }
        .del-btn { background: #ff4444; border: none; color: white; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

<header><div class="logo" onclick="openAdmin()">ABOUD STORE</div></header>

<div id="admin-panel">
    <h3>إضافة منتج</h3>
    <input type="text" id="pN" placeholder="اسم الجهاز">
    <input type="text" id="pP" placeholder="السعر">
    <input type="file" id="pI" accept="image/*">
    <button onclick="save()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:8px; font-weight:bold;">نشر</button>
    <div id="admin-list" style="margin-top:20px;"></div>
</div>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="ابحث عن هاتف، سماعة، أو شاحن..." onkeyup="filterProducts()">
</div>

<div class="products-grid" id="public-list"></div>

<div id="cartBar" class="cart-float">
    <div>السلة: <span id="cartCount">0</span> قطع | المجموع: <span id="cartTotal">0</span> د.ع</div>
    <a href="#" onclick="sendOrder()" class="btn-send"><i class="fab fa-whatsapp"></i> اطلب الآن</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s",
        authDomain: "aboud-store-f7a16.firebaseapp.com",
        projectId: "aboud-store-f7a16",
        databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com",
        appId: "1:554846072421:web:214e6516b8cbf88715208c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cart = [];
    let allProducts = [];

    function openAdmin() { if(prompt("الرمز:") === "ABOJL2001") document.getElementById('admin-panel').style.display='block'; }

    function save() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value, i = document.getElementById('pI').files[0];
        if(n && p && i) {
            const r = new FileReader();
            r.onload = (e) => { db.ref('products').push({ n, p, i: e.target.result }).then(() => location.reload()); };
            r.readAsDataURL(i);
        }
    }

    function remove(id) { if(confirm("حذف؟")) db.ref('products/' + id).remove(); }

    // البحث
    function filterProducts() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        renderProducts(allProducts.filter(p => p.n.toLowerCase().includes(query)));
    }

    // إضافة للسلة
    function addToCart(name, price) {
        const numPrice = parseInt(price.replace(/,/g, ''));
        cart.push({ name, price: numPrice });
        updateCartUI();
    }

    function updateCartUI() {
        const bar = document.getElementById('cartBar');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('cartCount').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = total.toLocaleString();
        }
    }

    function sendOrder() {
        let msg = "مرحباً عبود ستور، أريد طلب الآتي:%0a%0a";
        let total = 0;
        cart.forEach((item, index) => {
            msg += `${index + 1}- ${item.name} (${item.price.toLocaleString()} د.ع)%0a`;
            total += item.price;
        });
        msg += `%0a*الإجمالي: ${total.toLocaleString()} د.ع*`;
        window.open(`https://wa.me/9647818025533?text=${msg}`);
    }

    function renderProducts(products) {
        const list = document.getElementById('public-list');
        list.innerHTML = '';
        products.forEach(p => {
            list.innerHTML += `
                <div class="card">
                    <img src="${p.i}">
                    <h3>${p.n}</h3>
                    <div class="price">${p.p} د.ع</div>
                    <button class="add-cart" onclick="addToCart('${p.n}', '${p.p}')">إضافة للسلة</button>
                </div>`;
        });
    }

    db.ref('products').on('value', snap => {
        allProducts = [];
        const aList = document.getElementById('admin-list');
        aList.innerHTML = '';
        snap.forEach(c => {
            const d = c.val(); d.id = c.key;
            allProducts.push(d);
            aList.innerHTML += `<div class="admin-item"><span>${d.n}</span><button class="del-btn" onclick="remove('${d.id}')">حذف</button></div>`;
        });
        renderProducts(allProducts);
    });
</script>
</body>
</html>
