<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: radial-gradient(circle at top, #111 0%, #050505 100%); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); cursor: pointer; flex: 1; }
        .header-icons a { color: var(--neon); font-size: 1.4rem; text-decoration: none; }
        
        .search-container { padding: 15px 15px 5px 15px; }
        #searchBar { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(255,255,255,0.05); color: white; outline: none; font-family: 'Cairo'; box-sizing: border-box; }

        .slider-container { margin: 15px; border-radius: 20px; overflow: hidden; height: 200px; position: relative; border: 1px solid var(--neon); background: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); }
        .slider-container img { width: 100%; height: 100%; object-fit: contain; position: absolute; opacity: 0; transform: scale(1.1); transition: opacity 1s ease-in-out, transform 1.5s ease-in-out; }
        .slider-container img.active { opacity: 1; transform: scale(1); }

        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; }
        .cat-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 22px; border-radius: 30px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .cat-btn.active { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); border-color: var(--neon); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 25px; padding: 15px; border: 1px solid rgba(255,255,255,0.08); text-align: center; transition: 0.4s; }
        .card img { width: 100%; height: 150px; object-fit: contain; border-radius: 15px; background: #000; }
        .desc { font-size: 0.8rem; color: #aaa; margin: 10px 0; display: block; line-height: 1.4; max-height: 60px; overflow-y: auto; }
        .price { color: var(--neon); font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
        .add-cart { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; background: linear-gradient(45deg, var(--neon), #0088ff); color: #000; cursor: pointer; }

        #admin-panel { display: none; background: #111; padding: 20px; border: 2px solid var(--neon); margin: 15px; border-radius: 25px; position: absolute; width: 90%; z-index: 5000; top: 5%; box-sizing: border-box; }
        .admin-section { background: #1a1a1a; padding: 10px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; font-family: 'Cairo'; }
        
        .cart-wrapper { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 3000; }
        .cart-float { background: linear-gradient(90deg, var(--neon), #0088ff); color: #000; padding: 18px; border-radius: 20px; display: none; justify-content: space-between; align-items: center; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="header-icons"><a href="https://www.instagram.com/vh.rr/"><i class="fab fa-instagram"></i></a></div>
    <div class="logo" onclick="checkAdmin()">ABOUD STORE</div>
    <div class="header-icons"><a href="https://wa.me/9647818025533"><i class="fab fa-whatsapp"></i></a></div>
</header>

<div id="admin-panel">
    <button onclick="closeAdmin()" style="float:left; background:red; color:white; border:none; border-radius:50%; width:30px; height:30px;">X</button>
    <h3 id="formTitle">لوحة التحكم</h3>
    
    <div class="admin-section">
        <h4 style="color:var(--neon); margin:0;">إدارة المنتجات</h4>
        <input type="hidden" id="editId">
        <input type="text" id="pN" placeholder="اسم المنتج">
        <textarea id="pD" placeholder="الوصف"></textarea>
        <input type="text" id="pP" placeholder="السعر">
        <select id="pC">
            <option value="هواتف">هواتف</option>
            <option value="سماعات">سماعات</option>
            <option value="إكسسوارات">إكسسوارات</option>
            <option value="شواحن">شواحن</option>
        </select>
        <input type="file" id="pI" accept="image/*">
        <button id="saveBtn" onclick="save()" style="width:100%; padding:12px; background:var(--neon); border:none; border-radius:10px; font-weight:bold;">نشر منتج جديد</button>
    </div>

    <div class="admin-section">
        <h4 style="color:var(--purple); margin:0;">السلايدر (الإعلانات)</h4>
        <input type="file" id="adI" accept="image/*">
        <button onclick="uploadAd()" style="width:100%; padding:10px; background:var(--purple); color:white; border:none; border-radius:10px; font-weight:bold;">رفع إعلان</button>
        <div id="ads-admin-list" style="max-height:100px; overflow-y:auto; margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div id="admin-list" style="max-height:150px; overflow-y:auto; border-top:1px solid #333; padding-top:10px; font-size:0.85rem;"></div>
</div>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="عن ماذا تبحث اليوم؟" onkeyup="search()">
</div>

<div class="slider-container" id="ads-slider"></div>

<div class="categories">
    <div class="cat-btn active" onclick="filterCat('الكل', this)">الكل</div>
    <div class="cat-btn" onclick="filterCat('هواتف', this)">هواتف</div>
    <div class="cat-btn" onclick="filterCat('سماعات', this)">سماعات</div>
    <div class="cat-btn" onclick="filterCat('إكسسوارات', this)">إكسسوارات</div>
    <div class="cat-btn" onclick="filterCat('شواحن', this)">شواحن</div>
</div>

<div class="products-grid" id="main-list"></div>

<div class="cart-wrapper">
    <div id="cartDetails" style="background:rgba(0,0,0,0.95); border:1px solid var(--neon); border-radius:20px; margin-bottom:10px; display:none; padding:15px;"></div>
    <div id="cartBar" class="cart-float" onclick="toggleCart()">
        <span>🛒 <span id="count">0</span> قطع | <span id="total">0</span> د.ع</span>
        <button style="background:#000; color:#fff; border:none; padding:8px 15px; border-radius:10px;" onclick="sendWA(event)">اطلب الآن</button>
    </div>
</div>

<script>
    const config = { apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s", databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    let items = [], cart = [], adInterval;

    function checkAdmin() { if(prompt("الرمز:") === "ABOJL2001") document.getElementById('admin-panel').style.display='block'; }
    function closeAdmin() { document.getElementById('admin-panel').style.display='none'; resetForm(); }
    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('pN').value = '';
        document.getElementById('pD').value = '';
        document.getElementById('pP').value = '';
        document.getElementById('saveBtn').innerText = "نشر منتج جديد";
        document.getElementById('formTitle').innerText = "لوحة التحكم";
    }

    function save() {
        const id = document.getElementById('editId').value, n = document.getElementById('pN').value, d = document.getElementById('pD').value, p = document.getElementById('pP').value, c = document.getElementById('pC').value, imgFile = document.getElementById('pI').files[0];
        let data = { n, d, p, c };
        if(imgFile) {
            const r = new FileReader();
            r.onload = (e) => { data.i = e.target.result; id ? db.ref('products/'+id).update(data) : db.ref('products').push(data); resetForm(); };
            r.readAsDataURL(imgFile);
        } else if(id) {
            db.ref('products/'+id).update(data).then(() => resetForm());
        } else { alert("اختر صورة للمنتج الجديد"); }
    }

    function editProd(id, n, d, p, c) {
        document.getElementById('editId').value = id;
        document.getElementById('pN').value = n;
        document.getElementById('pD').value = d;
        document.getElementById('pP').value = p;
        document.getElementById('pC').value = c;
        document.getElementById('saveBtn').innerText = "تحديث البيانات";
        document.getElementById('formTitle').innerText = "تعديل المنتج الحالي";
        window.scrollTo(0,0);
    }

    function uploadAd() {
        const i = document.getElementById('adI').files[0];
        if(!i) return;
        const r = new FileReader();
        r.onload = (e) => { db.ref('ads').push({ i: e.target.result }); };
        r.readAsDataURL(i);
    }

    db.ref('ads').on('value', s => {
        const container = document.getElementById('ads-slider');
        const adminList = document.getElementById('ads-admin-list');
        container.innerHTML = ''; adminList.innerHTML = '';
        if(!s.exists()) return;
        let adsData = s.val(), index = 0;
        for(let id in adsData) {
            const img = document.createElement('img'); img.src = adsData[id].i;
            if(index === 0) img.classList.add('active');
            container.appendChild(img);
            adminList.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>إعلان ${index+1}</span><button onclick="db.ref('ads/${id}').remove()" style="color:red; background:none; border:none;">حذف</button></div>`;
            index++;
        }
        startSlider();
    });

    function startSlider() {
        clearInterval(adInterval); let sIdx = 0;
        adInterval = setInterval(() => {
            const imgs = document.querySelectorAll('#ads-slider img');
            if(imgs.length > 1) { imgs[sIdx].classList.remove('active'); sIdx = (sIdx + 1) % imgs.length; imgs[sIdx].classList.add('active'); }
        }, 4000);
    }

    db.ref('products').on('value', s => {
        items = []; const aL = document.getElementById('admin-list'); aL.innerHTML = '<strong>المنتجات:</strong>';
        s.forEach(c => {
            const d = c.val(); d.id = c.key; items.push(d);
            aL.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #222"><span>${d.n}</span><div><button onclick="editProd('${d.id}','${d.n}','${d.d}','${d.p}','${d.c}')" style="color:orange; background:none; border:none; margin-left:10px;">تعديل</button><button onclick="db.ref('products/${d.id}').remove()" style="color:red; background:none; border:none;">حذف</button></div></div>`;
        });
        render(items);
    });

    function render(data) {
        const l = document.getElementById('main-list'); l.innerHTML = '';
        data.forEach(p => { l.innerHTML += `<div class="card"><img src="${p.i}"><h3>${p.n}</h3><span class="desc">${p.d || ''}</span><div class="price">${p.p} د.ع</div><button class="add-cart" onclick="addToCart('${p.n}', '${p.p}')">إضافة للسلة</button></div>`; });
    }

    function search() { const q = document.getElementById('searchBar').value.toLowerCase(); render(items.filter(x => x.n.toLowerCase().includes(q))); }
    function filterCat(cat, btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(cat === 'الكل' ? items : items.filter(x => x.c === cat)); }
    function addToCart(n, p) { cart.push({ n, p: parseInt(p.toString().replace(/,/g, '')) }); updateUI(); }
    function updateUI() {
        const bar = document.getElementById('cartBar'), det = document.getElementById('cartDetails');
        if(cart.length > 0) {
            bar.style.display = 'flex'; document.getElementById('count').innerText = cart.length;
            let sum = 0; det.innerHTML = '<h4>🛒 السلة:</h4>';
            cart.forEach((x, i) => { sum += x.p; det.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>${x.n}</span><i class="fas fa-times" style="color:red" onclick="cart.splice(${i},1);updateUI()"></i></div>`; });
            document.getElementById('total').innerText = sum.toLocaleString();
        } else { bar.style.display = 'none'; det.style.display = 'none'; }
    }
    function sendWA(e) { e.stopPropagation(); let m = "طلب من عبود ستور:%0a"; cart.forEach((x, i) => m += `${i+1}- ${x.n}%0a`); window.open(`https://wa.me/9647818025533?text=${m}`); }
    function toggleCart() { const d = document.getElementById('cartDetails'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
</script>
</body>
</html>
