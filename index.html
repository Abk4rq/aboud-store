<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | النسخة الاحترافية الشاملة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 120px; scroll-behavior: smooth; }
        
        header { background: rgba(0,0,0,0.95); padding: 12px 15px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .datetime-container { text-align: left; font-size: 0.75rem; color: #aaa; font-weight: bold; line-height: 1.2; }
        .live-time { color: var(--neon); font-size: 0.85rem; font-family: monospace; }

        .slider-box { margin: 15px; height: 180px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        .slider-box img { width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; opacity: 0; transition: 1s; }
        .slider-box img.active { opacity: 1; }

        /* لوحة الإدارة */
        #admin-panel { display: none; background: #0a0a0a; padding: 20px; border-bottom: 2px solid var(--neon); }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        .btn-action { width: 100%; padding: 12px; background: var(--neon); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* البحث والأقسام */
        .search-area { padding: 10px 15px; }
        #searchBar { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        
        /* ستايل تمييز النيون للكلمات المبحوث عنها */
        .highlight { background: var(--neon); color: black; font-weight: bold; padding: 0 2px; border-radius: 3px; box-shadow: 0 0 8px var(--neon); }

        .categories { display: flex; gap: 10px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 18px; background: var(--card); border: 1px solid #222; border-radius: 20px; white-space: nowrap; font-size: 0.8rem; cursor: pointer; color: #ccc; }
        .cat-btn.active { background: var(--neon); color: black; border-color: var(--neon); font-weight: bold; }

        /* المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 15px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .card img { width: 100%; border-radius: 10px; }
        
        /* شارات الثقة الفخمة فوق الصورة */
        .badge { position: absolute; top: 18px; right: 18px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); color: var(--neon); font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--neon); font-weight: bold; z-index: 5; }
        
        /* زر مشاركة المنتج */
        .share-btn { position: absolute; top: 18px; left: 18px; background: rgba(255,255,255,0.07); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); color: #ccc; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; z-index: 5; transition: 0.2s; }
        .share-btn:hover { color: var(--neon); border-color: var(--neon); }

        .card h4 { margin: 8px 0 2px 0; font-size: 0.95rem; font-weight: bold; transition: 0.2s; }
        
        /* نظام النجوم للتقييم */
        .stars { color: #ffb700; font-size: 0.7rem; margin-bottom: 4px; display: flex; gap: 2px; }

        .desc { font-size: 0.8rem; color: #b3b3b3; margin: 4px 0 10px 0; line-height: 1.4; white-space: pre-line; }
        .price { color: var(--neon); font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        
        /* زر السلة مع نبض النيون الذكي */
        .btn-add-cart { width: 100%; background: var(--neon); border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; animation: pulseGlow 2s infinite; }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }

        .admin-controls { position: absolute; top: 50px; left: 18px; display: none; flex-direction: column; gap: 4px; z-index: 10; }
        .ctrl-icon { background: rgba(0,0,0,0.8); padding: 6px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; text-align: center; }

        /* السلة */
        .cart-fab { position: fixed; bottom: 20px; left: 20px; background: var(--neon); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; z-index: 3000; box-shadow: 0 0 20px var(--neon); cursor: pointer; }

        /* زر الصعود للأعلى الزجاجي */
        .scroll-top-btn { position: fixed; bottom: 85px; left: 20px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.3); color: var(--neon); width: 45px; height: 45px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 2900; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .scroll-top-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }

/* ستايل عداد الزوار العام بأسفل الصفحة */
.footer-counter { display: flex; justify-content: center; align-items: center; }
.footer-counter span { color: var(--neon); font-weight: 900; font-size: 1.2rem; }

/* تأثير الهيكل العظمي المؤقت الفخم المتناسق مع متجرك */
.skeleton-card {
    background: rgba(255, 255, 255, 0.03) !important;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 15px;
    height: 340px;
    position: relative;
    overflow: hidden;
}
.skeleton-card::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: loading-shimmer 1.5s infinite;
}
@keyframes loading-shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

</style>
</head>
<body>

<header>
    <i class="fas fa-user-shield" onclick="handleAuth()" style="color: var(--neon); cursor: pointer;"></i>
    <div class="logo">ABOUD STORE</div>
    <div class="datetime-container">
        <div class="live-time" id="liveTime">00:00:00 م</div>
        <div id="liveDate">اليوم</div>
    </div>
</header>

<div id="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="formTitle" style="margin:0;">إضافة جديد</h3>
        <button onclick="auth.signOut(); location.reload()" style="background:red; border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">خروج</button>
    </div>
    <select id="uploadType" onchange="toggleFields()">
        <option value="product">منتج</option>
        <option value="ad">إعلان (سلايدر)</option>
    </select>

    <div id="productFields">
        <input type="text" id="name" placeholder="اسم المنتج">
        <input type="text" id="price" placeholder="السعر">
        <textarea id="desc" placeholder="وصف المنتج"></textarea>
        <select id="cat">
            <option value="هواتف">هواتف</option>
            <option value="سماعات">سماعات</option>
            <option value="ساعات">ساعات</option>
            <option value="شواحن">شواحن</option>
            <option value="كابلات">كابلات</option>
            <option value="عدسات">عدسات</option>
            <option value="اكسسوارات">اكسسوارات عامة</option>
        </select>
    </div>
    
    <input type="file" id="file" accept="image/*">
    <input type="hidden" id="editId">
    <button onclick="submitData()" id="subBtn" class="btn-action">حفظ ونشر</button>
    <div id="adsList" style="margin-top:15px; border-top:1px solid #222; padding-top:10px;"></div>
</div>

<div class="slider-box" id="adsSlider"></div>

<div class="search-area">
    <input type="text" id="searchBar" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
</div>

<div class="categories">
    <div class="cat-btn active" onclick="filterCat('الكل', this)">الكل</div>
    <div class="cat-btn" onclick="filterCat('هواتف', this)">هواتف</div>
    <div class="cat-btn" onclick="filterCat('سماعات', this)">سماعات</div>
    <div class="cat-btn" onclick="filterCat('ساعات', this)">ساعات</div>
    <div class="cat-btn" onclick="filterCat('شواحن', this)">شواحن</div>
    <div class="cat-btn" onclick="filterCat('كابلات', this)">كابلات</div>
    <div class="cat-btn" onclick="filterCat('عدسات', this)">عدسات</div>
    <div class="cat-btn" onclick="filterCat('اكسسوارات', this)">اكسسوارات عامة</div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="footer-counter">
    <i class="fas fa-eye" style="color: var(--neon);"></i>
    <div>عدد زوار متجرنا: <span id="visitorCount">0</span> زائر</div>
</div>

<div class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()">
    <i class="fas fa-arrow-up"></i>
</div>

<div class="cart-fab" onclick="document.getElementById('cartModal').style.display='block'">
    <i class="fas fa-shopping-basket"></i>
    <span id="cartCount" style="position:absolute; top:0; right:0; background:red; color:white; border-radius:50%; width:18px; height:18px; font-size:0.7rem; display:flex; align-items:center; justify-content:center;">0</span>
</div>

<div id="cartModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:4000; padding:20px; box-sizing: border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--neon); padding-bottom:10px;">
        <h2>سلة الطلبات</h2>
        <i class="fas fa-times" onclick="document.getElementById('cartModal').style.display='none'" style="cursor:pointer;"></i>
    </div>
    <div id="cartItems" style="margin-top:20px; max-height:60vh; overflow-y:auto;"></div>
    <button onclick="sendWA()" style="width:100%; background:#25D366; color:white; border:none; padding:15px; border-radius:10px; margin-top:20px; font-weight:bold; font-size:1.1rem; cursor:pointer;">اطلب الآن عبر واتساب</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s", databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    let allProducts = [], cart = [];

    // إعداد ملف الصوت الرقمي للتفاعل النيوني مع الأزرار
    const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav');
    clickSound.volume = 0.3; // حجم صوت هادئ وناعم
    function playClick() { clickSound.currentTime = 0; clickSound.play().catch(()=>{}); }

    // كود العداد الذكي: يمنع زيادة الزوار لو مسجل دخول كمسؤول (Admin)
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('admin-panel').style.display = 'block';
            document.querySelectorAll('.admin-controls').forEach(el => el.style.display = 'flex');
        } else {
            if (!sessionStorage.getItem('visited')) {
                db.ref('visitors').transaction(currentValue => {
                    return (currentValue || 0) + 1;
                });
                sessionStorage.setItem('visited', 'true');
            }
        }
    });

    db.ref('visitors').on('value', snap => {
        document.getElementById('visitorCount').innerText = snap.val() || 0;
    });

    function handleAuth() {
        if(!auth.currentUser) {
            const e = prompt("الايميل:"), p = prompt("الباسورد:");
            if(e && p) auth.signInWithEmailAndPassword(e,p).catch(() => alert("خطأ في تسجيل الدخول"));
        }
    }

    function toggleFields() {
        document.getElementById('productFields').style.display = document.getElementById('uploadType').value === 'product' ? 'block' : 'none';
    }

    db.ref('ads').on('value', s => {
        const slider = document.getElementById('adsSlider');
        const list = document.getElementById('adsList');
        slider.innerHTML = ''; list.innerHTML = '';
        s.forEach(c => {
            slider.innerHTML += `<img src="${c.val().i}">`;
            if(auth.currentUser) list.innerHTML += `<div style="padding:8px; border-bottom:1px solid #222; display:flex; justify-content:space-between;"><span>إعلان سلايدر</span><span onclick="del('ads','${c.key}')" style="color:red; cursor:pointer;">حذف</span></div>`;
        });
        if(slider.firstChild) slider.firstChild.classList.add('active');
    });

        // جلب وتوزيع المنتجات بسرعة البرق مع التحميل الانسيابي للصور
    db.ref('products').on('value', s => {
        allProducts = [];
        const grid = document.getElementById('mainGrid'); 
        grid.innerHTML = '';
        
        s.forEach(c => {
            const p = c.val(); p.id = c.key;
            allProducts.push(p);
            const isAdmin = auth.currentUser ? 'flex' : 'none';
            
            let badgeText = "أصلي 100% ✨";
            if(p.c === 'هواتف' || p.c === 'ساعات') badgeText = "الأكثر مبيعاً 🔥";
            if(p.c === 'شواحن') badgeText = "شحن سريع ⚡";

            grid.innerHTML += `
                <div class="card" data-cat="${p.c}" data-name="${p.n}">
                    <div class="badge">${badgeText}</div>
                    <div class="share-btn" onclick="playClick(); shareProduct('${p.n}', '${p.p}')" title="مشاركة المنتج">
                        <i class="fas fa-share-alt"></i>
                    </div>
                    <div class="admin-controls" style="display:${isAdmin}">
                        <i class="fas fa-edit ctrl-icon" style="color:#fff" onclick="edit('${p.id}')"></i>
                        <i class="fas fa-trash ctrl-icon" style="color:red" onclick="del('products','${p.id}')"></i>
                    </div>
                    <div style="width:100%; height:160px; background-image: url(${p.i}); background-size: cover; background-position: center; border-radius:10px; background-color: rgba(255,255,255,0.02); content-visibility: auto;">
                    </div>
                    <h4 class="product-title" data-original="${p.n}">${p.n}</h4>
                    <div class="stars">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                    </div>
                    <div class="desc">${p.d || ''}</div>
                    <div class="price">${p.p} د.ع</div>
                    <button class="btn-add-cart" onclick="playClick(); addToCart('${p.n}','${p.p}')">إضافة للسلة</button>
                </div>`;
        });
    });


    function shareProduct(name, price) {
    const shareData = {
        title: `Aboud Store | ${name}`,
        text: `📦 المنتج: ${name}\n💰 السعر: ${price} د.ع\n📍 متوفر في Aboud Store!`,
        url: window.location.href
    };

    if (navigator.share) {
        navigator.share(shareData)
            .then(() => console.log('تمت المشاركة بنجاح'))
            .catch((error) => console.log('تم إلغاء المشاركة:', error));
    } else {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(shareData.text).then(() => {
                alert("تم نسخ تفاصيل المنتج! متصفحك لا يدعم المشاركة المباشرة.");
            });
        } else {
            alert(shareData.text);
        }
    }
}


    // دالة الفلترة الذكية المحدثة مع تلوين الكلمات المبحوث عنها بلون النيون
    function filterProducts() {
        const val = document.getElementById('searchBar').value.trim().toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            const titleEl = c.querySelector('.product-title');
            const origName = titleEl.getAttribute('data-original');
            
            if (origName.toLowerCase().includes(val)) {
                c.style.display = 'block';
                if (val !== "") {
                    // تحديد مكان الكلمة المبحوث عنها واستبدالها بالـ Span الملوّن
                    const regex = new RegExp(`(${val})`, 'gi');
                    titleEl.innerHTML = origName.replace(regex, `<span class="highlight">$1</span>`);
                } else {
                    titleEl.innerHTML = origName;
                }
            } else {
                c.style.display = 'none';
            }
        });
    }

    // مراقبة النزول لأسفل الصفحة لإظهار/إخفاء زر الصعود للأعلى
    window.onscroll = function() {
        const btn = document.getElementById('scrollTopBtn');
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            btn.style.display = "flex";
        } else {
            btn.style.display = "none";
        }
    };
    function scrollToTop() { playClick(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function edit(id) {
        const p = allProducts.find(x => x.id === id);
        if(!p) return;
        document.getElementById('name').value = p.n;
        document.getElementById('price').value = p.p;
        document.getElementById('desc').value = p.d || '';
        document.getElementById('cat').value = p.c || 'هواتف';
        document.getElementById('editId').value = id;
        document.getElementById('uploadType').value = 'product';
        toggleFields();
        document.getElementById('formTitle').innerText = "تعديل منتج حركي";
        window.scrollTo(0,0);
    }

    function submitData() {
        const type = document.getElementById('uploadType').value;
        const file = document.getElementById('file').files[0];
        const editId = document.getElementById('editId').value;
        
        const data = {
            n: document.getElementById('name').value,
            p: document.getElementById('price').value,
            d: document.getElementById('desc').value,
            c: document.getElementById('cat').value
        };

        const save = (img) => {
            if(img) data.i = img;
            const ref = editId ? db.ref(`products/${editId}`) : db.ref(type === 'product' ? 'products' : 'ads').push();
            if(editId && !img) {
                db.ref(`products/${editId}`).once('value', snap => {
                    data.i = snap.val().i;
                    db.ref(`products/${editId}`).set(data).then(() => location.reload());
                });
            } else { ref.set(type === 'product' ? data : {i: img}).then(() => location.reload()); }
        };
        if(file) { const r = new FileReader(); r.onload = (e) => save(e.target.result); r.readAsDataURL(file); } else { save(); }
    }

    function del(path, id) { if(confirm("هل أنت متأكد من الحذف؟")) db.ref(path+'/'+id).remove().then(() => location.reload()); }

    function filterCat(cat, btn) {
        playClick();
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.card').forEach(c => {
            if(cat === 'الكل') { c.style.display = 'block'; } else {
                c.style.display = (c.getAttribute('data-cat') === cat || (cat === 'اكسسوارات' && c.getAttribute('data-cat') === 'اكسسوارات عامة')) ? 'block' : 'none';
            }
        });
    }

    function addToCart(n, p) { cart.push({n,p}); updateCart(); }
    function updateCart() {
        document.getElementById('cartCount').innerText = cart.length;
        const list = document.getElementById('cartItems'); list.innerHTML = '';
        cart.forEach((item, i) => list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:12px; background:rgba(255,255,255,0.02); padding:10px; border-radius:8px;"><span>${item.n} (${item.p} د.ع)</span><i class="fas fa-trash" style="color:red; cursor:pointer;" onclick="playClick(); cart.splice(${i},1); updateCart()"></i></div>`);
    }

    function sendWA() {
        if(cart.length === 0) return alert("السلة فارغة حبيب قلبي");
        let m = "مرحباً Aboud Store، أود طلب المنتجات التالية:\n\n"; 
        cart.forEach((item, index) => {
            m += `${index + 1}️⃣ *اسم المنتج:* ${item.n}\n💰 *السعر:* ${item.p} د.ع\n`;
            m += `----------------------------\n`;
        });
        window.location.href = `https://wa.me/9647818025533?text=${encodeURIComponent(m)}`;
    }

    function updateLiveDateTime() {
        const now = new Date();
        let hours = now.getHours(); let minutes = now.getMinutes(); let seconds = now.getSeconds();
        const ampm = hours >= 12 ? 'م' : 'ص'; hours = hours % 12; hours = hours ? hours : 12; 
        minutes = minutes < 10 ? '0' + minutes : minutes; seconds = seconds < 10 ? '0' + seconds : seconds;
        document.getElementById('liveTime').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        document.getElementById('liveDate').innerText = `${days[now.getDay()]}، ${now.getDate()} ${months[now.getMonth()]}`;
    }
    setInterval(updateLiveDateTime, 1000); updateLiveDateTime();

    setInterval(() => {
        const imgs = document.querySelectorAll('.slider-box img'); if(imgs.length < 2) return;
        let act = document.querySelector('.slider-box img.active');
        if(act) { act.classList.remove('active'); let nxt = act.nextElementSibling || imgs[0]; nxt.classList.add('active'); }
    }, 4000);
</script>
</body>
</html>
