<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | المتجر المتكامل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 100px; }
        header { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 15px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* لوحة التحكم */
        #admin-panel { display: none; background: #0a0a0a; padding: 20px; border: 2px solid var(--neon); margin: 15px; border-radius: 20px; position: fixed; width: 90%; z-index: 3000; top: 10%; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 30px var(--neon); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }

        /* السلة المنبثقة */
        #cart-modal { display: none; position: fixed; bottom: 80px; left: 5%; width: 90%; background: #111; border: 1px solid var(--neon); border-radius: 20px; padding: 15px; z-index: 4000; max-height: 50vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        
        /* أيقونة السلة العائمة */
        .cart-fab { position: fixed; bottom: 20px; left: 20px; background: var(--neon); color: black; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 2500; cursor: pointer; box-shadow: 0 0 20px var(--neon); }
        .cart-count { position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }

        /* السلايدر والمنتجات */
        .slider-container { margin: 15px; border-radius: 20px; overflow: hidden; height: 180px; position: relative; border: 1px solid var(--neon); }
        .slider-container img { width: 100%; height: 100%; object-fit: contain; position: absolute; opacity: 0; transition: 0.8s; }
        .slider-container img.active { opacity: 1; }
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; border-radius: 10px; }
        .price { color: var(--neon); font-weight: bold; margin: 5px 0; }
        .admin-tools { position: absolute; top: 5px; right: 5px; display: none; }
    </style>
</head>
<body>

<header>
    <i class="fas fa-user-shield" onclick="toggleAdmin()" style="color: var(--neon);"></i>
    <div class="logo">ABOUD STORE</div>
    <div style="width: 30px;"></div>
</header>

<div id="admin-panel">
    <div style="display:flex; justify-content:space-between;">
        <h3 style="color:var(--neon)">الإدارة</h3>
        <button onclick="auth.signOut(); location.reload();" style="background:red; border:none; color:white; border-radius:5px;">خروج</button>
    </div>
    <select id="type" onchange="document.getElementById('pFields').style.display = this.value=='p'?'block':'none'">
        <option value="p">منتج جديد</option>
        <option value="a">إعلان جديد</option>
    </select>
    <div id="pFields">
        <input type="text" id="name" placeholder="الاسم">
        <input type="text" id="price" placeholder="السعر">
    </div>
    <input type="file" id="file" accept="image/*">
    <button onclick="upload()" id="upBtn" style="width:100%; padding:12px; background:var(--neon); border:none; border-radius:10px; margin-top:10px;">نشر</button>
    <div id="adsList" style="margin-top:20px;"></div>
</div>

<div class="slider-container" id="slider"></div>
<div class="products-grid" id="list"></div>

<div class="cart-fab" onclick="document.getElementById('cart-modal').style.display='block'">
    <i class="fas fa-shopping-basket"></i>
    <div class="cart-count" id="count">0</div>
</div>

<div id="cart-modal">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--neon); padding-bottom:10px;">
        <h3 style="margin:0">سلة المشتريات</h3>
        <i class="fas fa-times" onclick="document.getElementById('cart-modal').style.display='none'"></i>
    </div>
    <div id="cart-items"></div>
    <button onclick="sendOrder()" style="width:100%; background:#25D366; color:white; border:none; padding:12px; border-radius:10px; margin-top:15px; font-weight:bold;">اطلب الآن عبر واتساب</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s", databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    let cart = [];

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('admin-panel').style.display = 'block';
            document.querySelectorAll('.admin-tools').forEach(e => e.style.display = 'block');
        }
    });

    function toggleAdmin() {
        if(!auth.currentUser) {
            const e = prompt("الايميل:"), p = prompt("الباسورد:");
            auth.signInWithEmailAndPassword(e,p).catch(a => alert("خطأ"));
        } else {
            const s = document.getElementById('admin-panel').style;
            s.display = s.display === 'none' ? 'block' : 'none';
        }
    }

    // إدارة البيانات
    db.ref('ads').on('value', s => {
        const sl = document.getElementById('slider'), adL = document.getElementById('adsList');
        sl.innerHTML = ''; adL.innerHTML = '';
        s.forEach(c => {
            sl.innerHTML += `<img src="${c.val().i}">`;
            if(auth.currentUser) adL.innerHTML += `<div style="padding:5px; border-bottom:1px solid #222;">إعلان <span onclick="del('ads','${c.key}')" style="color:red; float:left;">حذف</span></div>`;
        });
        if(sl.firstChild) sl.firstChild.classList.add('active');
    });

    db.ref('products').on('value', s => {
        const l = document.getElementById('list'); l.innerHTML = '';
        s.forEach(c => {
            const d = c.val();
            l.innerHTML += `
                <div class="card">
                    <div class="admin-tools" style="display:${auth.currentUser?'block':'none'}">
                        <i class="fas fa-trash" style="color:red" onclick="del('products','${c.key}')"></i>
                    </div>
                    <img src="${d.i}">
                    <h4 style="font-size:0.8rem">${d.n}</h4>
                    <div class="price">${d.p} د.ع</div>
                    <button onclick="addToCart('${d.n}', '${d.p}')" style="width:100%; padding:8px; background:var(--neon); border:none; border-radius:8px; font-weight:bold; font-size:0.7rem">إضافة للسلة</button>
                </div>`;
        });
    });

    function upload() {
        const t = document.getElementById('type').value, f = document.getElementById('file').files[0];
        if(!f) return alert("اختر صورة");
        const r = new FileReader();
        r.onload = (e) => {
            const o = { i: e.target.result };
            if(t == 'p') { o.n = document.getElementById('name').value; o.p = document.getElementById('price').value; }
            db.ref(t=='p'?'products':'ads').push(o).then(() => location.reload());
        };
        r.readAsDataURL(f);
    }

    function del(p, id) { if(confirm("حذف؟")) db.ref(p+'/'+id).remove(); }

    // نظام السلة المطور
    function addToCart(n, p) {
        cart.push({n, p});
        updateCartUI();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('count').innerText = cart.length;
        const container = document.getElementById('cart-items');
        container.innerHTML = '';
        cart.forEach((item, index) => {
            container.innerHTML += `
                <div class="cart-item">
                    <span>${item.n} (${item.p} د.ع)</span>
                    <i class="fas fa-minus-circle" style="color:red" onclick="removeFromCart(${index})"></i>
                </div>`;
        });
    }

    function sendOrder() {
        if(cart.length === 0) return alert("السلة فارغة!");
        let msg = "طلب جديد من Aboud Store:\n";
        cart.forEach(i => msg += `- ${i.n} (${i.p})\n`);
        window.location.href = `https://wa.me/9647818025533?text=${encodeURIComponent(msg)}`;
    }

    setInterval(() => {
        const imgs = document.querySelectorAll('.slider-container img');
        if(imgs.length < 2) return;
        let a = document.querySelector('.slider-container img.active');
        a.classList.remove('active');
        let n = a.nextElementSibling || imgs[0];
        n.classList.add('active');
    }, 4000);
</script>
</body>
</html>
