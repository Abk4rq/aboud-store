<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: radial-gradient(circle at top, #111 0%, #050505 100%); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; box-shadow: 0 5px 20px rgba(0, 242, 255, 0.2); }
        .logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); cursor: pointer; flex: 1; }
        .header-icons a { color: var(--neon); font-size: 1.4rem; transition: 0.3s; text-decoration: none; }
        .search-container { padding: 15px; }
        #searchBar { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(255,255,255,0.05); color: white; outline: none; font-family: 'Cairo'; box-sizing: border-box; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 25px; padding: 15px; border: 1px solid rgba(255,255,255,0.08); text-align: center; backdrop-filter: blur(5px); transition: 0.4s; }
        .card img { width: 100%; height: 160px; object-fit: contain; border-radius: 20px; background: #000; }
        .desc { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; display: block; min-height: 1.2em; }
        .price { color: var(--neon); font-weight: bold; margin-bottom: 12px; font-size: 1.1rem; }
        .add-cart { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; background: linear-gradient(45deg, var(--neon), #00a2ff); color: #000; cursor: pointer; }
        .cart-wrapper { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 3000; }
        .cart-float { background: linear-gradient(90deg, var(--neon), #0088ff); color: #000; padding: 18px; border-radius: 20px; display: none; justify-content: space-between; align-items: center; font-weight: 900; box-shadow: 0 8px 30px rgba(0, 242, 255, 0.4); cursor: pointer; }
        .remove-item-btn { color: #ff4444; cursor: pointer; padding: 5px; margin-right: 10px; }
        #admin-panel { display: none; background: #111; padding: 25px; border: 1px solid var(--neon); margin: 20px; border-radius: 20px; }
        textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; font-family: 'Cairo'; }
    </style>
</head>
<body>

<header>
    <div class="header-icons"><a href="https://wa.me/9647818025533"><i class="fab fa-whatsapp"></i></a></div>
    <div class="logo" onclick="checkAdmin()">ABOUD STORE</div>
    <div class="header-icons"><a href="https://www.instagram.com/vh.rr/"><i class="fab fa-instagram"></i></a></div>
</header>

<div id="admin-panel">
    <h3 id="formTitle" style="color:var(--neon)">إضافة منتج جديد</h3>
    <input type="hidden" id="editId">
    <input type="text" id="pN" placeholder="اسم الجهاز">
    <textarea id="pD" placeholder="وصف المنتج"></textarea>
    <input type="text" id="pP" placeholder="السعر">
    <input type="file" id="pI" accept="image/*">
    <button id="mainBtn" onclick="handleAction()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">نشر الآن</button>
    <div id="admin-list" style="margin-top:25px;"></div>
</div>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="ابحث عن هاتف أو ملحق..." onkeyup="search()">
</div>

<div class="products-grid" id="main-list"></div>

<div class="cart-wrapper">
    <div id="cartDetails" style="background:rgba(10,10,10,0.95); border:1px solid var(--neon); border-radius:20px; margin-bottom:12px; display:none; max-height:300px; overflow-y:auto; padding:15px;"></div>
    <div id="cartBar" class="cart-float" onclick="toggleCart()">
        <span><i class="fas fa-shopping-bag"></i> <span id="count">0</span> قطع | <span id="total">0</span> د.ع</span>
        <button style="background:#000; color:#fff; padding:10px 20px; border-radius:12px; border:none; font-weight:bold;" onclick="sendToWA(event)">اطلب الآن</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s",
        authDomain: "aboud-store-f7a16.firebaseapp.com",
        projectId: "aboud-store-f7a16",
        databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com",
        appId: "1:554846072421:web:214e6516b8cbf88715208c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cart = [], items = [];

    function checkAdmin() { if(prompt("الرمز:") === "ABOJL2001") document.getElementById('admin-panel').style.display='block'; }

    function handleAction() {
        const id = document.getElementById('editId').value, n = document.getElementById('pN').value, d = document.getElementById('pD').value, p = document.getElementById('pP').value, i = document.getElementById('pI').files[0];
        if(!n || !p) return alert("املأ الاسم والسعر");

        const data = { n, d, p };
        if(i) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                data.i = e.target.result;
                id ? db.ref('products/'+id).update(data) : db.ref('products').push(data);
                location.reload();
            };
            reader.readAsDataURL(i);
        } else {
            id ? db.ref('products/'+id).update(data).then(()=>location.reload()) : alert("اختر صورة");
        }
    }

    function editProd(id, n, d, p) {
        document.getElementById('editId').value = id;
        document.getElementById('pN').value = n;
        document.getElementById('pD').value = d;
        document.getElementById('pP').value = p;
        document.getElementById('formTitle').innerText = "تعديل المنتج";
        document.getElementById('mainBtn').innerText = "حفظ التعديلات";
        window.scrollTo(0, 0);
    }

    function deleteProd(id) { if(confirm("حذف نهائي؟")) db.ref('products/' + id).remove(); }

    function search() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        display(items.filter(x => x.n.toLowerCase().includes(q)));
    }

    function addToCart(n, p) {
        cart.push({ n, p: parseInt(p.toString().replace(/,/g, '')) });
        updateCart();
    }

    function removeFromCart(idx, e) {
        e.stopPropagation();
        cart.splice(idx, 1);
        updateCart();
    }

    function toggleCart() { const det = document.getElementById('cartDetails'); det.style.display = (det.style.display === 'block') ? 'none' : 'block'; }

    function updateCart() {
        const bar = document.getElementById('cartBar'), det = document.getElementById('cartDetails');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('count').innerText = cart.length;
            let sum = 0; det.innerHTML = '<h4 style="color:var(--neon)">السلة:</h4>';
            cart.forEach((x, i) => { sum += x.p; det.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #222;"><span>${x.n}</span><span>${x.p.toLocaleString()} <i class="fas fa-trash-alt remove-item-btn" onclick="removeFromCart(${i}, event)"></i></span></div>`; });
            document.getElementById('total').innerText = sum.toLocaleString();
        } else { bar.style.display = 'none'; det.style.display = 'none'; }
    }

    function sendToWA(e) {
        e.stopPropagation();
        let m = "طلب جديد من عبود ستور:%0a";
        cart.forEach((x, i) => m += `${i+1}- ${x.n}%0a`);
        window.open(`https://wa.me/9647818025533?text=${m}`);
    }

    function display(data) {
        const list = document.getElementById('main-list');
        list.innerHTML = '';
        data.forEach(p => {
            list.innerHTML += `<div class="card"><img src="${p.i}"><h3>${p.n}</h3><span class="desc">${p.d || ''}</span><div class="price">${p.p} د.ع</div><button class="add-cart" onclick="addToCart('${p.n}', '${p.p}')">إضافة للسلة</button></div>`;
        });
    }

    db.ref('products').on('value', s => {
        items = [];
        const aL = document.getElementById('admin-list'); aL.innerHTML = '';
        s.forEach(c => {
            const d = c.val(); d.id = c.key; items.push(d);
            aL.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333"><span>${d.n}</span><div><button onclick="editProd('${d.id}','${d.n}','${d.d}','${d.p}')" style="background:orange; color:white; border:none; border-radius:5px; margin-left:5px">تعديل</button><button onclick="deleteProd('${d.id}')" style="background:red; color:white; border:none; border-radius:5px">حذف</button></div></div>`;
        });
        display(items);
    });
</script>
</body>
</html>
