<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | النسخة الكاملة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --bg: #050505; --card: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 100px; }
        
        header { background: rgba(0,0,0,0.95); padding: 15px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo { font-size: 1.5rem; font-weight: 900; background: linear-gradient(to right, var(--neon), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* شاشة الإعلانات (السلايدر) */
        .slider-box { margin: 15px; height: 180px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; position: absolute; opacity: 0; transition: 1s; }
        .slider-box img.active { opacity: 1; }

        /* لوحة الإدارة */
        #admin-panel { display: none; background: #0a0a0a; padding: 20px; border-bottom: 2px solid var(--neon); }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        .btn-action { width: 100%; padding: 12px; background: var(--neon); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* البحث والأقسام */
        .search-area { padding: 10px 15px; }
        #searchBar { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        .categories { display: flex; gap: 10px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .cat-btn { padding: 8px 18px; background: var(--card); border: 1px solid #222; border-radius: 20px; white-space: nowrap; font-size: 0.8rem; }
        .cat-btn.active { background: var(--neon); color: black; border-color: var(--neon); }

        /* المنتجات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; border-radius: 10px; }
        .price { color: var(--neon); font-weight: bold; margin: 5px 0; font-size: 1.1rem; }
        
        .admin-controls { position: absolute; top: 5px; left: 5px; display: none; gap: 4px; }
        .ctrl-icon { background: rgba(0,0,0,0.7); padding: 5px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; }

        /* السلة */
        .cart-fab { position: fixed; bottom: 20px; left: 20px; background: var(--neon); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; z-index: 3000; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<header>
    <i class="fas fa-user-shield" onclick="handleAuth()" style="color: var(--neon); cursor: pointer;"></i>
    <div class="logo">ABOUD STORE</div>
    <div style="width:20px"></div>
</header>

<div id="admin-panel">
    <h3 id="formTitle">إضافة جديد</h3>
    <select id="uploadType" onchange="toggleFields()">
        <option value="product">منتج</option>
        <option value="ad">إعلان (سلايدر)</option>
    </select>

    <div id="productFields">
        <input type="text" id="name" placeholder="اسم المنتج">
        <input type="text" id="price" placeholder="السعر">
        <textarea id="desc" placeholder="الوصف"></textarea>
        <select id="cat">
            <option value="ساعات">ساعات</option>
            <option value="سماعات">سماعات</option>
            <option value="اكسسوارات">اكسسوارات</option>
        </select>
    </div>
    
    <input type="file" id="file" accept="image/*">
    <input type="hidden" id="editId">
    <button onclick="submitData()" id="subBtn" class="btn-action">حفظ ونشر</button>
    <div id="adsList" style="margin-top:10px;"></div>
</div>

<div class="slider-box" id="adsSlider"></div>

<div class="search-area">
    <input type="text" id="searchBar" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
</div>

<div class="categories">
    <div class="cat-btn active" onclick="filterCat('الكل', this)">الكل</div>
    <div class="cat-btn" onclick="filterCat('ساعات', this)">ساعات</div>
    <div class="cat-btn" onclick="filterCat('سماعات', this)">سماعات</div>
    <div class="cat-btn" onclick="filterCat('اكسسوارات', this)">اكسسوارات</div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="cart-fab" onclick="document.getElementById('cartModal').style.display='block'">
    <i class="fas fa-shopping-basket"></i>
    <span id="cartCount" style="position:absolute; top:0; right:0; background:red; color:white; border-radius:50%; width:18px; height:18px; font-size:0.7rem; display:flex; align-items:center; justify-content:center;">0</span>
</div>

<div id="cartModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:4000; padding:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--neon); padding-bottom:10px;">
        <h2>سلة الطلبات</h2>
        <i class="fas fa-times" onclick="document.getElementById('cartModal').style.display='none'"></i>
    </div>
    <div id="cartItems" style="margin-top:20px;"></div>
    <button onclick="sendWA()" style="width:100%; background:#25D366; color:white; border:none; padding:15px; border-radius:10px; margin-top:20px; font-weight:bold;">اطلب الآن عبر واتساب</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s", databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.database();
    let cart = [];

    auth.onAuthStateChanged(user => {
        if(user) document.getElementById('admin-panel').style.display = 'block';
    });

    function handleAuth() {
        if(!auth.currentUser) {
            const e = prompt("الايميل:"), p = prompt("الباسورد:");
            auth.signInWithEmailAndPassword(e,p).catch(() => alert("خطأ"));
        }
    }

    function toggleFields() {
        document.getElementById('productFields').style.display = document.getElementById('uploadType').value === 'product' ? 'block' : 'none';
    }

    // جلب الإعلانات للسلايدر
    db.ref('ads').on('value', s => {
        const slider = document.getElementById('adsSlider');
        const list = document.getElementById('adsList');
        slider.innerHTML = ''; list.innerHTML = '';
        s.forEach(c => {
            slider.innerHTML += `<img src="${c.val().i}">`;
            if(auth.currentUser) list.innerHTML += `<div style="padding:5px; border-bottom:1px solid #222;">إعلان <span onclick="del('ads','${c.key}')" style="color:red; float:left;">حذف</span></div>`;
        });
        if(slider.firstChild) slider.firstChild.classList.add('active');
    });

    // جلب المنتجات
    db.ref('products').on('value', s => {
        const grid = document.getElementById('mainGrid'); grid.innerHTML = '';
        s.forEach(c => {
            const p = c.val(); p.id = c.key;
            const isAdmin = auth.currentUser ? 'flex' : 'none';
            grid.innerHTML += `
                <div class="card" data-cat="${p.c}" data-name="${p.n}">
                    <div class="admin-controls" style="display:${isAdmin}">
                        <i class="fas fa-edit ctrl-icon" onclick="edit('${p.id}')"></i>
                        <i class="fas fa-trash ctrl-icon" style="color:red" onclick="del('products','${p.id}')"></i>
                    </div>
                    <img src="${p.i}">
                    <h4>${p.n}</h4>
                    <div class="price">${p.p} د.ع</div>
                    <button onclick="addToCart('${p.n}','${p.p}')" style="width:100%; background:var(--neon); border:none; padding:8px; border-radius:5px; font-weight:bold;">إضافة للسلة</button>
                </div>`;
        });
    });

    function submitData() {
        const type = document.getElementById('uploadType').value;
        const file = document.getElementById('file').files[0];
        const editId = document.getElementById('editId').value;
        const data = { n: document.getElementById('name').value, p: document.getElementById('price').value, d: document.getElementById('desc').value, c: document.getElementById('cat').value };

        const save = (img) => {
            if(img) data.i = img;
            const ref = editId ? db.ref(`products/${editId}`) : db.ref(type === 'product' ? 'products' : 'ads').push();
            ref.set(data).then(() => location.reload());
        };

        if(file) {
            const r = new FileReader(); r.onload = (e) => save(e.target.result); r.readAsDataURL(file);
        } else if(editId) { save(); }
    }

    function del(path, id) { if(confirm("حذف؟")) db.ref(path+'/'+id).remove(); }

    function filterProducts() {
        const val = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => c.style.display = c.getAttribute('data-name').toLowerCase().includes(val) ? 'block' : 'none');
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.card').forEach(c => c.style.display = (cat === 'الكل' || c.getAttribute('data-cat') === cat) ? 'block' : 'none');
    }

    function addToCart(n, p) { cart.push({n,p}); updateCart(); }
    function updateCart() {
        document.getElementById('cartCount').innerText = cart.length;
        const list = document.getElementById('cartItems'); list.innerHTML = '';
        cart.forEach((item, i) => list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${item.n}</span><i class="fas fa-trash" style="color:red" onclick="cart.splice(${i},1); updateCart()"></i></div>`);
    }

    function sendWA() {
        let m = "طلب جديد:\n"; cart.forEach(i => m += `- ${i.n}\n`);
        window.location.href = `https://wa.me/9647818025533?text=${encodeURIComponent(m)}`;
    }

    setInterval(() => {
        const imgs = document.querySelectorAll('.slider-box img');
        if(imgs.length < 2) return;
        let act = document.querySelector('.slider-box img.active');
        act.classList.remove('active');
        let nxt = act.nextElementSibling || imgs[0];
        nxt.classList.add('active');
    }, 4000);
</script>
</body>
</html>
