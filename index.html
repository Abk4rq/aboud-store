<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --card: #121212; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* الهيدر مع الأيقونات الجانبية */
        header { 
            background: rgba(0,0,0,0.9); padding: 15px; text-align: center; 
            border-bottom: 2px solid var(--neon); position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-icons { font-size: 1.2rem; color: var(--neon); display: flex; gap: 15px; width: 60px; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); flex: 1; cursor: pointer; }

        /* شريط البحث */
        .search-container { padding: 15px; }
        #searchBar { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--neon); background: #111; color: white; font-family: 'Cairo'; box-sizing: border-box; outline: none; }

        /* شبكة المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: contain; border-radius: 15px; background: #000; }
        .price { color: var(--neon); font-weight: bold; margin: 10px 0; font-size: 1.1rem; }
        .add-cart { width: 100%; padding: 12px; background: var(--neon); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* السلة المطورة */
        .cart-wrapper { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 2000; }
        .cart-float { 
            background: var(--neon); color: #000; padding: 15px; border-radius: 15px; 
            display: none; justify-content: space-between; align-items: center; font-weight: bold;
            box-shadow: 0 0 25px var(--neon); cursor: pointer;
        }
        .cart-items-list { 
            background: #111; border: 1px solid var(--neon); border-radius: 15px; 
            margin-bottom: 10px; display: none; max-height: 250px; overflow-y: auto; padding: 10px;
        }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .remove-item { color: #ff4444; cursor: pointer; padding: 5px; }
        .btn-send { background: #000; color: #fff; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-size: 0.9rem; border: none; font-weight: bold; }

        /* لوحة التحكم */
        #admin-panel { display: none; background: #000; padding: 20px; border: 1px solid var(--neon); margin: 15px; border-radius: 15px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <div class="header-icons">
        <a href="https://wa.me/9647818025533" style="color:inherit"><i class="fab fa-whatsapp"></i></a>
    </div>
    <div class="logo" onclick="openAdmin()">ABOUD STORE</div>
    <div class="header-icons" style="justify-content: flex-end;">
        <a href="https://www.instagram.com/vh.rr/" style="color:inherit"><i class="fab fa-instagram"></i></a>
    </div>
</header>

<div id="admin-panel">
    <h3>إضافة منتج</h3>
    <input type="text" id="pN" placeholder="اسم الجهاز">
    <input type="text" id="pP" placeholder="السعر">
    <input type="file" id="pI" accept="image/*">
    <button onclick="save()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:8px; font-weight:bold;">نشر الآن</button>
    <div id="admin-list" style="margin-top:20px;"></div>
</div>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="ابحث عن هاتف أو ملحق..." onkeyup="filter()">
</div>

<div class="products-grid" id="list"></div>

<div class="cart-wrapper">
    <div id="cartItemsList" class="cart-items-list"></div>
    <div id="cartBar" class="cart-float" onclick="toggleCartItems()">
        <div><i class="fas fa-shopping-basket"></i> <span id="cCount">0</span> قطع | <span id="cTotal">0</span> د.ع</div>
        <button onclick="sendOrder(event)" class="btn-send">اطلب الآن</button>
    </div>
</div>

<script>
    const config = {
        apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s",
        authDomain: "aboud-store-f7a16.firebaseapp.com",
        projectId: "aboud-store-f7a16",
        databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com",
        appId: "1:554846072421:web:214e6516b8cbf88715208c"
    };
    firebase.initializeApp(config);
    const db = firebase.database();

    let cart = [];
    let allP = [];

    function openAdmin() { if(prompt("الرمز:") === "ABOJL2001") document.getElementById('admin-panel').style.display='block'; }

    function save() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value, i = document.getElementById('pI').files[0];
        if(n && p && i) {
            const r = new FileReader();
            r.onload = (e) => { db.ref('products').push({ n, p, i: e.target.result }).then(() => location.reload()); };
            r.readAsDataURL(i);
        }
    }

    function removeProduct(id) { if(confirm("حذف المنتج نهائياً؟")) db.ref('products/' + id).remove(); }

    function filter() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        render(allP.filter(x => x.n.toLowerCase().includes(q)));
    }

    function addToCart(n, p) {
        const price = parseInt(p.replace(/,/g, ''));
        cart.push({ n, price, id: Date.now() });
        updateUI();
    }

    function removeFromCart(index, event) {
        event.stopPropagation();
        cart.splice(index, 1);
        updateUI();
    }

    function toggleCartItems() {
        const list = document.getElementById('cartItemsList');
        list.style.display = (list.style.display === 'block') ? 'none' : 'block';
    }

    function updateUI() {
        const bar = document.getElementById('cartBar');
        const list = document.getElementById('cartItemsList');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('cCount').innerText = cart.length;
            let total = 0;
            list.innerHTML = '<h4 style="margin:5px; color:var(--neon)">محتويات السلة:</h4>';
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <span>${item.n}</span>
                        <span>${item.price.toLocaleString()} <i class="fas fa-trash remove-item" onclick="removeFromCart(${index}, event)"></i></span>
                    </div>`;
            });
            document.getElementById('cTotal').innerText = total.toLocaleString();
        } else {
            bar.style.display = 'none';
            list.style.display = 'none';
        }
    }

    function sendOrder(e) {
        e.stopPropagation();
        let msg = "طلب جديد من عبود ستور:%0a%0a";
        let total = 0;
        cart.forEach((item, idx) => {
            msg += `${idx+1}- ${item.n} (${item.price.toLocaleString()} د.ع)%0a`;
            total += item.price;
        });
        msg += `%0a*الإجمالي: ${total.toLocaleString()} د.ع*`;
        window.open(`https://wa.me/9647818025533?text=${msg}`);
    }

    function render(data) {
        const l = document.getElementById('list');
        l.innerHTML = '';
        data.forEach(p => {
            l.innerHTML += `
                <div class="card">
                    <img src="${p.i}">
                    <h3>${p.n}</h3>
                    <div class="price">${p.p} د.ع</div>
                    <button class="add-cart" onclick="addToCart('${p.n}', '${p.p}')">إضافة للسلة</button>
                </div>`;
        });
    }

    db.ref('products').on('value', s => {
        allP = [];
        const aL = document.getElementById('admin-list');
        aL.innerHTML = '';
        s.forEach(c => {
            const d = c.val(); d.id = c.key;
            allP.push(d);
            aL.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #222"><span>${d.n}</span><button onclick="removeProduct('${d.id}')" style="background:red; color:white; border:none; border-radius:5px">حذف</button></div>`;
        });
        render(allP);
    });
</script>
</body>
</html>
