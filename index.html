<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aboud Store | عبود ستور</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --neon: #00f2ff; 
            --purple: #bc13fe;
            --bg: #050505; 
            --card: rgba(255, 255, 255, 0.03); 
        }
        
        body { 
            background: radial-gradient(circle at top, #111 0%, #050505 100%); 
            color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-bottom: 120px; 
            overflow-x: hidden;
        }
        
        /* الهيدر المطور */
        header { 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 15px 20px; 
            text-align: center; border-bottom: 2px solid var(--neon); 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2000;
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.2);
        }

        .logo { 
            font-size: 1.6rem; font-weight: 900; 
            background: linear-gradient(to right, var(--neon), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5));
            cursor: pointer; flex: 1;
        }

        .header-icons a { color: var(--neon); font-size: 1.4rem; transition: 0.3s; text-decoration: none; }
        .header-icons a:hover { color: var(--purple); transform: scale(1.2); }

        /* شريط البحث */
        .search-container { padding: 15px; }
        #searchBar { 
            width: 100%; padding: 14px; border-radius: 15px; 
            border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(255,255,255,0.05); 
            color: white; outline: none; font-family: 'Cairo'; transition: 0.3s; box-sizing: border-box;
        }
        #searchBar:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        /* المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 15px; padding: 15px; }
        .card { 
            background: var(--card); border-radius: 25px; padding: 15px; 
            border: 1px solid rgba(255,255,255,0.08); text-align: center;
            backdrop-filter: blur(5px); transition: 0.4s; position: relative;
        }
        .card:hover { border-color: var(--neon); transform: translateY(-8px); background: rgba(255,255,255,0.08); }
        .card img { width: 100%; height: 160px; object-fit: contain; border-radius: 20px; background: #000; }
        .price { color: var(--neon); font-weight: bold; margin: 12px 0; font-size: 1.15rem; }

        .add-cart { 
            width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; 
            background: linear-gradient(45deg, var(--neon), #00a2ff); color: #000;
            cursor: pointer; transition: 0.3s;
        }
        .add-cart:active { transform: scale(0.95); }

        /* السلة العائمة */
        .cart-wrapper { position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 3000; }
        .cart-items-list { 
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--neon); border-radius: 20px; 
            margin-bottom: 12px; display: none; max-height: 300px; overflow-y: auto; padding: 15px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
        }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        .remove-btn { color: #ff4444; cursor: pointer; padding: 5px; font-size: 1.1rem; }

        .cart-float { 
            background: linear-gradient(90deg, var(--neon), #0088ff); color: #000; padding: 18px; border-radius: 20px; 
            display: none; justify-content: space-between; align-items: center; font-weight: 900;
            box-shadow: 0 8px 30px rgba(0, 242, 255, 0.4); cursor: pointer;
        }
        .btn-order { background: #000; color: #fff; padding: 10px 20px; border-radius: 12px; border: none; font-weight: bold; font-family: 'Cairo'; }

        /* لوحة التحكم */
        #admin-panel { display: none; background: #111; padding: 25px; border: 1px solid var(--neon); margin: 20px; border-radius: 20px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <div class="header-icons"><a href="https://wa.me/9647818025533"><i class="fab fa-whatsapp"></i></a></div>
    <div class="logo" onclick="checkAdmin()">ABOUD STORE</div>
    <div class="header-icons"><a href="https://www.instagram.com/vh.rr/"><i class="fab fa-instagram"></i></a></div>
</header>

<div id="admin-panel">
    <h3 style="color:var(--neon)">إضافة منتج جديد</h3>
    <input type="text" id="pN" placeholder="اسم الجهاز">
    <input type="text" id="pP" placeholder="السعر">
    <input type="file" id="pI" accept="image/*">
    <button onclick="upload()" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:10px; font-weight:bold;">نشر في المتجر</button>
    <div id="admin-list" style="margin-top:25px;"></div>
</div>

<div class="search-container">
    <input type="text" id="searchBar" placeholder="ابحث عن هاتف، سماعة، أو ملحق..." onkeyup="search()">
</div>

<div class="products-grid" id="main-list"></div>

<div class="cart-wrapper">
    <div id="cartDetails" class="cart-items-list"></div>
    <div id="cartBar" class="cart-float" onclick="toggleCart()">
        <span><i class="fas fa-shopping-bag"></i> <span id="count">0</span> قطع | <span id="total">0</span> د.ع</span>
        <button class="btn-order" onclick="sendToWA(event)">اطلب الآن</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAQF4Tj_QSa09H9FZ90tT3WTvsaSf-nW9s",
        authDomain: "aboud-store-f7a16.firebaseapp.com",
        projectId: "aboud-store-f7a16",
        databaseURL: "https://aboud-store-f7a16-default-rtdb.firebaseio.com",
        appId: "1:554846072421:web:214e6516b8cbf88715208c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cart = [];
    let items = [];

    function checkAdmin() { if(prompt("الرمز:") === "ABOJL2001") document.getElementById('admin-panel').style.display='block'; }

    function upload() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value, i = document.getElementById('pI').files[0];
        if(n && p && i) {
            const reader = new FileReader();
            reader.onload = (e) => { db.ref('products').push({ n, p, i: e.target.result }).then(() => location.reload()); };
            reader.readAsDataURL(i);
        }
    }

    function deleteProd(id) { if(confirm("حذف؟")) db.ref('products/' + id).remove(); }

    function search() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        display(items.filter(x => x.n.toLowerCase().includes(q)));
    }

    function addToCart(n, p) {
        cart.push({ n, p: parseInt(p.replace(/,/g, '')), id: Date.now() });
        updateCart();
    }

    function removeFromCart(idx, e) {
        e.stopPropagation();
        cart.splice(idx, 1);
        updateCart();
    }

    function toggleCart() {
        const d = document.getElementById('cartDetails');
        d.style.display = (d.style.display === 'block') ? 'none' : 'block';
    }

    function updateCart() {
        const bar = document.getElementById('cartBar');
        const det = document.getElementById('cartDetails');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('count').innerText = cart.length;
            let sum = 0;
            det.innerHTML = '<h4 style="color:var(--neon); margin-bottom:10px;">طلباتك المختارة:</h4>';
            cart.forEach((item, i) => {
                sum += item.p;
                det.innerHTML += `<div class="cart-item"><span>${item.n}</span><span>${item.p.toLocaleString()} د.ع <i class="fas fa-trash-alt remove-btn" onclick="removeFromCart(${i}, event)"></i></span></div>`;
            });
            document.getElementById('total').innerText = sum.toLocaleString();
        } else {
            bar.style.display = 'none'; det.style.display = 'none';
        }
    }

    function sendToWA(e) {
        e.stopPropagation();
        let m = "مرحباً عبود ستور، أريد طلب المنتجات التالية:%0a%0a";
        let t = 0;
        cart.forEach((x, i) => { m += `${i+1}- ${x.n} (${x.p.toLocaleString()} د.ع)%0a`; t += x.p; });
        m += `%0a*الإجمالي النهائي: ${t.toLocaleString()} د.ع*`;
        window.open(`https://wa.me/9647818025533?text=${m}`);
    }

    function display(data) {
        const list = document.getElementById('main-list');
        list.innerHTML = '';
        data.forEach(p => {
            list.innerHTML += `
                <div class="card">
                    <img src="${p.i}">
                    <h3>${p.n}</h3>
                    <div class="price">${p.p} د.ع</div>
                    <button class="add-cart" onclick="addToCart('${p.n}', '${p.p}')">إضافة للسلة</button>
                </div>`;
        });
    }

    db.ref('products').on('value', s => {
        items = [];
        const aL = document.getElementById('admin-list');
        aL.innerHTML = '';
        s.forEach(c => {
            const d = c.val(); d.id = c.key;
            items.push(d);
            aL.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333"><span>${d.n}</span><button onclick="deleteProd('${d.id}')" style="background:red; color:white; border:none; border-radius:5px; padding:5px 10px;">حذف</button></div>`;
        });
        display(items);
    });
</script>
</body>
</html>
