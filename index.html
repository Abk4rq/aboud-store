<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUD STORE | عبود ستور</title>
    <!-- استدعاء مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --main-orange: #f97316; --dark-green: #064e3b; --bg-navy: #0f172a; --card-white: #ffffff; }
        body { background-color: var(--bg-navy); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        header { background: var(--dark-green); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main-orange); }
        .logo { color: var(--main-orange); font-weight: bold; font-size: 1.5rem; cursor: pointer; }
        
        /* لوحة التحكم مخفية افتراضياً */
        #adminPanel { display: none; margin: 20px; padding: 20px; border: 2px dashed var(--main-orange); border-radius: 20px; background: rgba(30, 41, 59, 0.9); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; }
        .add-btn { background: var(--main-orange); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .card { background: var(--card-white); border-radius: 15px; padding: 10px; text-align: center; color: #1e293b; position: relative; }
        .card img { width: 100%; height: 140px; border-radius: 10px; object-fit: cover; }
        .price { color: var(--main-orange); font-weight: bold; margin: 5px 0; }
        .wa-btn { background: #22c55e; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .del-btn { position: absolute; top: 5px; left: 5px; background: red; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="checkAdmin()">ABOUD STORE</div>
    <div>🛒</div>
</header>

<div id="adminPanel">
    <h3>لوحة إدارة عبود ستور</h3>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر د.ع">
    <input type="file" id="pImgFile" accept="image/*">
    <button class="add-btn" onclick="uploadToFirebase()">نشر المنتج للجميع</button>
</div>

<div class="products-grid" id="productsDisplay">
    <!-- المنتجات تظهر هنا من السيرفر -->
</div>

<script>
    // 1. ضع معلومات مشروعك هنا من Firebase Console
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. دالة التحقق من الأدمن (اضغط على اللوجو لتفتحها)
    function checkAdmin() {
        const pass = prompt("أدخل كلمة مرور الإدارة:");
        if(pass === "2026") { // يمكنك تغيير الرمز هنا
            document.getElementById('adminPanel').style.display = 'block';
            const delBtns = document.querySelectorAll('.del-btn');
            delBtns.forEach(btn => btn.style.display = 'block');
        }
    }

    // 3. رفع المنتج للسيرفر
    function uploadToFirebase() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const file = document.getElementById('pImgFile').files[0];

        if(name && price && file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                db.ref('products').push({
                    name: name,
                    price: price,
                    img: e.target.result
                });
                alert("تم النشر بنجاح! سيراها جميع الزوار الآن.");
                document.getElementById('adminPanel').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    // 4. جلب المنتجات وعرضها للجميع تلقائياً
    db.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        const display = document.getElementById('productsDisplay');
        display.innerHTML = '';
        for(let id in data) {
            const item = data[id];
            display.innerHTML += `
                <div class="card">
                    <button class="del-btn" onclick="deleteItem('${id}')">×</button>
                    <img src="${item.img}">
                    <h4>${item.name}</h4>
                    <div class="price">${parseInt(item.price).toLocaleString()} د.ع</div>
                    <button class="wa-btn" onclick="order('${item.name}')">اطلب الآن</button>
                </div>
            `;
        }
    });

    function deleteItem(id) {
        if(confirm("حذف المنتج من السيرفر؟")) db.ref('products/' + id).remove();
    }

    function order(name) {
        window.open(`https://wa.me/9647818025533?text=${encodeURIComponent('أريد طلب: ' + name)}`);
    }
</script>
</body>
</html>
